plugins { id 'com.android.application' }

android {
  namespace 'com.costas.apkbuilder'
  compileSdk 34

  defaultConfig {
    applicationId "com.costas.ultraaifree"
    minSdk 29
    targetSdk 34
    versionCode 3
    versionName "3.0"
  }

  buildTypes {
    debug { minifyEnabled false }
    release { minifyEnabled false }
  }
}
