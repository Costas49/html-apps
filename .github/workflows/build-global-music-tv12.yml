name: Build Kostas Global Music TV12

on:
  pull_request:
    branches: [ main ]
    paths:
      - "global-music-tv12/**"
      - ".github/workflows/build-global-music-tv12.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed install APK
        run: gradle -p global-music-tv12 :app:assembleDebug --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APK="global-music-tv12/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK"

      - name: Prepare APK
        run: |
          mkdir -p output
          cp global-music-tv12/app/build/outputs/apk/debug/app-debug.apk output/Kostas-Global-Music-TV12-v1.apk
          sha256sum output/Kostas-Global-Music-TV12-v1.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kostas-Global-Music-TV12-v1
          path: |
            output/Kostas-Global-Music-TV12-v1.apk
            output/SHA256.txt
          if-no-files-found: error
          retention-days: 30
