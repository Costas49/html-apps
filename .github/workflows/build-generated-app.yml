name: Build Generated APK

on:
  push:
    branches: [ main ]
    paths:
      - "generated-app/build-request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-apk-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare app from request
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape

          request_path = Path("generated-app/build-request.json")
          if not request_path.exists():
              raise SystemExit("Missing generated-app/build-request.json")

          req = json.loads(request_path.read_text(encoding="utf-8"))
          app_name = str(req.get("app_name", "")).strip()
          package_name = str(req.get("package_name", "")).strip()
          html_b64 = str(req.get("html_b64", "")).strip()
          version_code = int(req.get("version_code", 1))
          version_name = str(req.get("version_name", "1.0")).strip() or "1.0"

          if not app_name:
              raise SystemExit("App name is empty")
          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", package_name):
              raise SystemExit(f"Invalid package name: {package_name}")
          if version_code < 1 or version_code > 2100000000:
              raise SystemExit("Invalid version code")

          try:
              html = base64.b64decode(html_b64, validate=True).decode("utf-8")
          except Exception as exc:
              raise SystemExit(f"Invalid HTML payload: {exc}")

          assets = Path("generated-app/app/src/main/assets")
          values = Path("generated-app/app/src/main/res/values")
          assets.mkdir(parents=True, exist_ok=True)
          values.mkdir(parents=True, exist_ok=True)

          (assets / "index.html").write_text(html, encoding="utf-8")

          safe_app_name = escape(app_name).replace("'", "\\'")
          (values / "strings.xml").write_text(
              '<resources>\n'
              f'  <string name="app_name" formatted="false">{safe_app_name}</string>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          safe_version_name = version_name.replace("\\", "\\\\").replace('"', '\\"')
          gradle = f"""plugins {{ id 'com.android.application' }}

          android {{
            namespace 'com.costas.generatedwrapper'
            compileSdk 34

            defaultConfig {{
              applicationId "{package_name}"
              minSdk 29
              targetSdk 34
              versionCode {version_code}
              versionName "{safe_version_name}"
            }}

            buildTypes {{
              debug {{ minifyEnabled false }}
              release {{ minifyEnabled false }}
            }}
          }}
          """
          (Path("generated-app/app") / "build.gradle").write_text(gradle, encoding="utf-8")
          PY

      - name: Build APK
        run: gradle -p generated-app :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp generated-app/app/build/outputs/apk/debug/app-debug.apk output/Generated-App.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-App
          path: output/Generated-App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view generated-apk-latest >/dev/null 2>&1; then
            gh release upload generated-apk-latest output/Generated-App.apk --clobber
          else
            gh release create generated-apk-latest output/Generated-App.apk \
              --target "$GITHUB_SHA" \
              --title "Generated APK - Latest" \
              --notes "Latest APK created by Kostas APK Maker."
          fi
