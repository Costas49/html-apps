name: Build Costas APK Controller

on:
  pull_request:
    branches: [ main ]
    paths:
      - "costas-apk-controller/**"
      - ".github/workflows/build-costas-apk-controller.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build controller APK
        run: gradle -p costas-apk-controller :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp costas-apk-controller/app/build/outputs/apk/debug/app-debug.apk output/Costas-APK-Builder.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Costas-APK-Builder
          path: output/Costas-APK-Builder.apk
          if-no-files-found: error
          retention-days: 30
