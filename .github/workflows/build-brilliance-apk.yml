name: Build Brilliance AI APK

on:
  push:
    paths:
      - "brilliance-ai-android/**"
      - ".github/workflows/build-brilliance-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brilliance-ai-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Align APK
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Kostas-Brilliance-AI-unsigned-aligned.apk
          cp "$(dirname "$ZIPALIGN")/lib/apksigner.jar" app/build/outputs/apk/release/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Kostas-Brilliance-AI-build-files
          path: |
            brilliance-ai-android/app/build/outputs/apk/release/Kostas-Brilliance-AI-unsigned-aligned.apk
            brilliance-ai-android/app/build/outputs/apk/release/apksigner.jar
          if-no-files-found: error
