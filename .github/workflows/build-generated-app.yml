name: Build Generated APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p generated-app :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp generated-app/app/build/outputs/apk/debug/app-debug.apk output/Generated-App.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-App
          path: output/Generated-App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view generated-apk-latest >/dev/null 2>&1; then
            gh release upload generated-apk-latest output/Generated-App.apk --clobber
          else
            gh release create generated-apk-latest output/Generated-App.apk               --target "$GITHUB_SHA"               --title "Generated APK - Latest"               --notes "Latest APK created by Kostas APK Maker."
          fi
