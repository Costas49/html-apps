name: Build Kostas Ultra AI Free

on:
  push:
    branches: [ main ]
    paths:
      - "kostas-apk-maker/**"
      - ".github/workflows/build-kostas-apk-maker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable APK
        run: gradle -p kostas-apk-maker :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp kostas-apk-maker/app/build/outputs/apk/debug/app-debug.apk output/Kostas-Ultra-AI-Free.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kostas-Ultra-AI-Free
          path: output/Kostas-Ultra-AI-Free.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view kostas-ultra-ai-free-latest >/dev/null 2>&1; then
            gh release upload kostas-ultra-ai-free-latest output/Kostas-Ultra-AI-Free.apk --clobber
          else
            gh release create kostas-ultra-ai-free-latest output/Kostas-Ultra-AI-Free.apk \
              --target "$GITHUB_SHA" \
              --title "Kostas Ultra AI Free - Latest" \
              --notes "Android 10+ AI assistant and APK builder. Uses user-provided free-tier Gemini key and GitHub token."
          fi
