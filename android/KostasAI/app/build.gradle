plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kostas.kostasai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kostas.kostasai'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
