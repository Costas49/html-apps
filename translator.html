<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.mymemory.translated.net; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Παγκόσμιος Μεταφραστής</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1216;
      --panel: #191e26;
      --panel-2: #222936;
      --line: #344052;
      --ink: #f6f2e9;
      --muted: #aeb8c8;
      --accent: #7fb4ff;
      --ok: #8fe3c0;
      --error: #ffaaaa;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 18px 36px;
    }

    header { margin-bottom: 16px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.35rem, 5vw, 2rem); }
    h2 { margin: 0; font-size: 1rem; }
    p { margin: 0; }

    .sub,
    .privacy,
    .counter { color: var(--muted); }

    .sub { line-height: 1.5; }

    .language-row,
    .actions,
    .history-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language-row { margin-bottom: 12px; }
    .language-field { flex: 1; min-width: 0; }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 600;
    }

    select,
    textarea,
    button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font: inherit;
    }

    select,
    textarea {
      width: 100%;
      background: var(--panel);
      color: var(--ink);
    }

    select { min-height: 48px; padding: 10px 12px; }

    textarea {
      min-height: 120px;
      padding: 13px;
      resize: vertical;
      line-height: 1.5;
    }

    button {
      min-height: 46px;
      padding: 10px 15px;
      background: var(--panel-2);
      color: var(--ink);
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .48; cursor: default; }

    button:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .swap {
      width: 48px;
      flex: 0 0 48px;
      margin-top: 25px;
      color: var(--accent);
      font-size: 1.2rem;
    }

    .card {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .counter { margin-top: 6px; text-align: right; font-size: .82rem; }
    .counter.over { color: var(--error); }

    .actions { flex-wrap: wrap; margin-bottom: 12px; }
    .actions button { flex: 1; min-width: 120px; }
    .primary { border-color: var(--accent); color: var(--accent); font-weight: 700; }

    .output {
      min-height: 3.2rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 1.08rem;
      line-height: 1.55;
    }

    .status {
      min-height: 1.5rem;
      margin-bottom: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .status.ok { color: var(--ok); }
    .status.error { color: var(--error); }

    .privacy {
      margin-bottom: 20px;
      font-size: .82rem;
      line-height: 1.5;
    }

    .history {
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .history-head { justify-content: space-between; margin-bottom: 10px; }
    .small { min-height: 38px; padding: 7px 11px; font-size: .84rem; }

    .history-item {
      width: 100%;
      margin-bottom: 8px;
      padding: 11px 12px;
      text-align: left;
      line-height: 1.45;
    }

    .history-item span { display: block; overflow-wrap: anywhere; }
    .history-item .source { color: var(--muted); }
    .history-item .target { color: var(--ink); }

    @media (max-width: 560px) {
      main { padding-inline: 14px; }
      .language-row { display: grid; grid-template-columns: 1fr 48px; }
      .language-field:last-child { grid-column: 1 / -1; }
      .swap { grid-column: 2; grid-row: 1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Παγκόσμιος Μεταφραστής</h1>
      <p class="sub">Δωρεάν μετάφραση χωρίς λογαριασμό ή API key.</p>
    </header>

    <section aria-label="Επιλογή γλωσσών">
      <div class="language-row">
        <div class="language-field">
          <label for="from">Από</label>
          <select id="from"></select>
        </div>
        <button class="swap" id="swap" type="button" aria-label="Αντιστροφή γλωσσών" title="Αντιστροφή γλωσσών">⇄</button>
        <div class="language-field">
          <label for="to">Προς</label>
          <select id="to"></select>
        </div>
      </div>
    </section>

    <section class="card">
      <label for="src">Κείμενο</label>
      <textarea id="src" placeholder="Γράψε το κείμενο που θέλεις να μεταφράσεις…"></textarea>
      <p class="counter" id="counter">0 / 500 bytes</p>
    </section>

    <div class="actions">
      <button class="primary" id="go" type="button">Μετάφραση</button>
      <button id="clear" type="button">Καθαρισμός</button>
    </div>

    <section class="card" aria-labelledby="resultLabel">
      <label id="resultLabel">Μετάφραση</label>
      <div class="output" id="out" role="region" aria-live="polite">—</div>
    </section>

    <div class="actions">
      <button id="speak" type="button" disabled>🔊 Προφορά</button>
      <button id="copy" type="button" disabled>📋 Αντιγραφή</button>
      <button id="save" type="button" disabled>💾 Αποθήκευση</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">Έτοιμος.</p>
    <p class="privacy">Το κείμενο στέλνεται στην υπηρεσία MyMemory για τη μετάφραση. Η δωρεάν ανώνυμη χρήση έχει όριο 5.000 χαρακτήρων την ημέρα. Το ιστορικό μένει μόνο σε αυτή τη συσκευή.</p>

    <section class="history" id="historySection" hidden>
      <div class="history-head">
        <h2>Ιστορικό</h2>
        <button class="small" id="clearHistory" type="button">Καθαρισμός ιστορικού</button>
      </div>
      <div id="historyList"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const HISTORY_KEY = 'world_translator_history_v2';
    const MAX_BYTES = 500;
    const encoder = new TextEncoder();

    const LANGS = [
      ['el', 'Ελληνικά', 'el-GR'], ['en', 'Αγγλικά', 'en-US'], ['fr', 'Γαλλικά', 'fr-FR'],
      ['de', 'Γερμανικά', 'de-DE'], ['it', 'Ιταλικά', 'it-IT'], ['es', 'Ισπανικά', 'es-ES'],
      ['pt', 'Πορτογαλικά', 'pt-PT'], ['ru', 'Ρωσικά', 'ru-RU'], ['uk', 'Ουκρανικά', 'uk-UA'],
      ['tr', 'Τουρκικά', 'tr-TR'], ['ar', 'Αραβικά', 'ar-SA'], ['he', 'Εβραϊκά', 'he-IL'],
      ['zh', 'Κινεζικά', 'zh-CN'], ['ja', 'Ιαπωνικά', 'ja-JP'], ['ko', 'Κορεατικά', 'ko-KR'],
      ['hi', 'Χίντι', 'hi-IN'], ['bn', 'Μπενγκάλι', 'bn-BD'], ['ur', 'Ούρντου', 'ur-PK'],
      ['fa', 'Περσικά', 'fa-IR'], ['nl', 'Ολλανδικά', 'nl-NL'], ['sv', 'Σουηδικά', 'sv-SE'],
      ['no', 'Νορβηγικά', 'nb-NO'], ['da', 'Δανικά', 'da-DK'], ['fi', 'Φινλανδικά', 'fi-FI'],
      ['pl', 'Πολωνικά', 'pl-PL'], ['cs', 'Τσεχικά', 'cs-CZ'], ['ro', 'Ρουμανικά', 'ro-RO'],
      ['bg', 'Βουλγαρικά', 'bg-BG'], ['sr', 'Σερβικά', 'sr-RS'], ['sq', 'Αλβανικά', 'sq-AL'],
      ['hu', 'Ουγγρικά', 'hu-HU'], ['vi', 'Βιετναμικά', 'vi-VN'], ['th', 'Ταϊλανδικά', 'th-TH'],
      ['id', 'Ινδονησιακά', 'id-ID'], ['ms', 'Μαλαισιανά', 'ms-MY'], ['sw', 'Σουαχίλι', 'sw-KE']
    ];

    for (const [code, name] of LANGS) {
      $('from').add(new Option(name, code));
      $('to').add(new Option(name, code));
    }
    $('from').value = 'el';
    $('to').value = 'en';

    let last = null;
    let history = loadHistory();

    function setStatus(message, kind = '') {
      $('status').textContent = message;
      $('status').className = 'status' + (kind ? ' ' + kind : '');
    }

    function byteLength(value) {
      return encoder.encode(value).length;
    }

    function updateCounter() {
      const bytes = byteLength($('src').value.trim());
      $('counter').textContent = bytes + ' / ' + MAX_BYTES + ' bytes';
      $('counter').classList.toggle('over', bytes > MAX_BYTES);
      return bytes;
    }

    function languageName(code) {
      return LANGS.find(item => item[0] === code)?.[1] || code;
    }

    function speechLocale(code) {
      return LANGS.find(item => item[0] === code)?.[2] || code;
    }

    function decodeEntities(value) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = value;
      return textarea.value;
    }

    function loadHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        return Array.isArray(saved) ? saved.slice(0, 12) : [];
      } catch {
        return [];
      }
    }

    function storeHistory() {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch {
        setStatus('Η μετάφραση έγινε, αλλά το ιστορικό δεν αποθηκεύτηκε.', 'error');
      }
    }

    function setResult(item) {
      last = item;
      $('out').textContent = item.translatedText;
      $('out').lang = speechLocale(item.to);
      ['speak', 'copy', 'save'].forEach(id => { $(id).disabled = false; });
    }

    function resetResult() {
      last = null;
      $('out').textContent = '—';
      $('out').removeAttribute('lang');
      ['speak', 'copy', 'save'].forEach(id => { $(id).disabled = true; });
    }

    function addToHistory(item) {
      history = history.filter(entry => !(entry.text === item.text && entry.from === item.from && entry.to === item.to));
      history.unshift(item);
      history = history.slice(0, 12);
      storeHistory();
      renderHistory();
    }

    function renderHistory() {
      $('historySection').hidden = history.length === 0;
      const list = $('historyList');
      list.replaceChildren();

      for (const item of history) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'history-item';
        button.setAttribute('aria-label', 'Άνοιγμα αποθηκευμένης μετάφρασης');

        const source = document.createElement('span');
        source.className = 'source';
        source.textContent = languageName(item.from) + ': ' + item.text.slice(0, 80);

        const target = document.createElement('span');
        target.className = 'target';
        target.textContent = languageName(item.to) + ': ' + item.translatedText.slice(0, 80);

        button.append(source, target);
        button.addEventListener('click', () => {
          $('from').value = item.from;
          $('to').value = item.to;
          $('src').value = item.text;
          updateCounter();
          setResult(item);
          setStatus('Η μετάφραση φορτώθηκε από το ιστορικό.', 'ok');
        });
        list.appendChild(button);
      }
    }

    async function translate() {
      const text = $('src').value.trim();
      const from = $('from').value;
      const to = $('to').value;

      if (!text) {
        setStatus('Γράψε πρώτα ένα κείμενο.', 'error');
        $('src').focus();
        return;
      }

      if (from === to) {
        setStatus('Διάλεξε δύο διαφορετικές γλώσσες.', 'error');
        return;
      }

      if (updateCounter() > MAX_BYTES) {
        setStatus('Το κείμενο είναι μεγαλύτερο από το όριο των 500 bytes.', 'error');
        return;
      }

      $('go').disabled = true;
      setStatus('Γίνεται μετάφραση…');

      try {
        const params = new URLSearchParams({ q: text, langpair: from + '|' + to });
        const response = await fetch('https://api.mymemory.translated.net/get?' + params.toString());
        if (!response.ok) throw new Error('HTTP_' + response.status);

        const data = await response.json();
        if (data.quotaFinished) throw new Error('QUOTA');
        if (Number(data.responseStatus) !== 200 || !data.responseData?.translatedText) {
          throw new Error(data.responseDetails || 'API_ERROR');
        }

        const item = {
          text,
          from,
          to,
          translatedText: decodeEntities(data.responseData.translatedText),
          savedAt: Date.now()
        };

        setResult(item);
        addToHistory(item);
        setStatus('Η μετάφραση ολοκληρώθηκε.', 'ok');
      } catch (error) {
        if (error.message === 'QUOTA') {
          setStatus('Εξαντλήθηκε το σημερινό δωρεάν όριο. Δοκίμασε ξανά αύριο.', 'error');
        } else if (error.message === 'HTTP_429') {
          setStatus('Έγιναν πολλές μεταφράσεις. Περίμενε λίγο και ξαναδοκίμασε.', 'error');
        } else {
          setStatus('Η μετάφραση απέτυχε. Έλεγξε τη σύνδεση και δοκίμασε ξανά.', 'error');
        }
        console.error(error);
      } finally {
        $('go').disabled = false;
      }
    }

    $('src').addEventListener('input', updateCounter);
    $('src').addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        translate();
      }
    });

    $('go').addEventListener('click', translate);

    $('clear').addEventListener('click', () => {
      $('src').value = '';
      updateCounter();
      resetResult();
      setStatus('Έτοιμος.');
      $('src').focus();
    });

    $('swap').addEventListener('click', () => {
      const previousFrom = $('from').value;
      $('from').value = $('to').value;
      $('to').value = previousFrom;

      if (last && last.from === previousFrom && last.to === $('from').value) {
        $('src').value = last.translatedText;
        updateCounter();
        resetResult();
      }
      setStatus('Οι γλώσσες αντιστράφηκαν.');
    });

    $('speak').addEventListener('click', () => {
      if (!last) return;
      if (!('speechSynthesis' in window)) {
        setStatus('Η συσκευή δεν υποστηρίζει εκφώνηση.', 'error');
        return;
      }

      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(last.translatedText);
      utterance.lang = speechLocale(last.to);
      utterance.rate = 0.95;
      const voices = speechSynthesis.getVoices();
      const voice = voices.find(item => item.lang.toLowerCase().startsWith(last.to.toLowerCase()));
      if (voice) utterance.voice = voice;
      utterance.onstart = () => setStatus('Ακούγεται η προφορά…');
      utterance.onend = () => setStatus('Έτοιμος.', 'ok');
      utterance.onerror = () => setStatus('Δεν βρέθηκε κατάλληλη φωνή στη συσκευή.', 'error');
      speechSynthesis.speak(utterance);
    });

    $('copy').addEventListener('click', async () => {
      if (!last) return;
      try {
        await navigator.clipboard.writeText(last.translatedText);
        setStatus('Η μετάφραση αντιγράφηκε.', 'ok');
      } catch {
        setStatus('Η αντιγραφή δεν επιτρέπεται από αυτόν τον browser.', 'error');
      }
    });

    $('save').addEventListener('click', () => {
      if (!last) return;
      const content = [
        'ΑΠΟ ' + languageName(last.from) + ':',
        last.text,
        '',
        'ΠΡΟΣ ' + languageName(last.to) + ':',
        last.translatedText
      ].join('\n');
      const url = URL.createObjectURL(new Blob([content], { type: 'text/plain;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'metafrasi-' + new Date().toISOString().slice(0, 10) + '.txt';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus('Το αρχείο αποθηκεύτηκε.', 'ok');
    });

    $('clearHistory').addEventListener('click', () => {
      history = [];
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
      setStatus('Το ιστορικό καθαρίστηκε.', 'ok');
    });

    updateCounter();
    renderHistory();
  </script>
</body>
</html>
