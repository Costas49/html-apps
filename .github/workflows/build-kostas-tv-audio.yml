name: Build Kostas TV Audio APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "kostas-tv-audio-player/**"
      - ".github/workflows/build-kostas-tv-audio.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kostas-tv-audio-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Kostas-TV-Audio-AndroidTV12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kostas-TV-Audio-AndroidTV12
          path: kostas-tv-audio-player/app/build/outputs/apk/debug/Kostas-TV-Audio-AndroidTV12.apk
          if-no-files-found: error
