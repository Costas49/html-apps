name: Build NEXUS MIND 2 Deep Pattern APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'nexus-mind-android/v2.part*.b64'
      - 'nexus-mind-android/icon.b64'
      - '.github/workflows/nexus-mind-v2-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct NEXUS MIND 2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexus-v2-src
          mkdir -p /tmp/nexus-v2-src
          cat nexus-mind-android/v2.part*.b64 > /tmp/nexus-v2-source.b64
          base64 -d /tmp/nexus-v2-source.b64 > /tmp/nexus-v2-source.zip
          unzip -q /tmp/nexus-v2-source.zip -d /tmp/nexus-v2-src
          base64 -d nexus-mind-android/icon.b64 > /tmp/nexus-v2-src/nexus-mind-android/app/src/main/res/drawable/ic_launcher.png
          sed -i 's#android:icon="@drawable/ic_nexus"#android:icon="@drawable/ic_launcher"#' /tmp/nexus-v2-src/nexus-mind-android/app/src/main/AndroidManifest.xml || true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0"

      - name: Build and sign
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nexus-v2-src/nexus-mind-android
          sed -i 's#build-tools/35.0.0#build-tools/34.0.0#g' build_apk.sh || true
          sed -i 's#35.0.0#34.0.0#g' build_apk.sh || true
          bash build_apk.sh
          APK="dist/NEXUS_MIND_Android10_v1.0.apk"
          test -s "$APK"
          cp "$APK" dist/NEXUS_MIND_2_DeepPattern_Android10_SIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/NEXUS_MIND_2_DeepPattern_Android10_SIGNED.apk > dist/NEXUS_MIND_2_signature_verification.txt
          sha256sum dist/NEXUS_MIND_2_DeepPattern_Android10_SIGNED.apk > dist/NEXUS_MIND_2_SHA256.txt
          cat dist/NEXUS_MIND_2_signature_verification.txt
          cat dist/NEXUS_MIND_2_SHA256.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-MIND-2-DeepPattern-Android10-SIGNED
          path: |
            /tmp/nexus-v2-src/nexus-mind-android/dist/NEXUS_MIND_2_DeepPattern_Android10_SIGNED.apk
            /tmp/nexus-v2-src/nexus-mind-android/dist/NEXUS_MIND_2_signature_verification.txt
            /tmp/nexus-v2-src/nexus-mind-android/dist/NEXUS_MIND_2_SHA256.txt
          if-no-files-found: error
          retention-days: 30
