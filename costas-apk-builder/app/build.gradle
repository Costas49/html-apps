plugins {
    id 'com.android.application'
}

android {
    namespace 'com.costas.builder'
    compileSdk 34

    defaultConfig {
        applicationId "com.costas.photomotionai2"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "2.0"
        resValue "string", "app_name", "PhotoMotion AI 2"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
