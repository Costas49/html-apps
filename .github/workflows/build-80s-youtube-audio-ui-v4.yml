name: Build 80s YouTube Audio UI v4

on:
  pull_request:
    branches: [ main ]
    paths:
      - "eighties-youtube-audio-ui-v4/**"
      - ".github/workflows/build-80s-youtube-audio-ui-v4.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle -p eighties-youtube-audio-ui-v4 :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p output
          cp eighties-youtube-audio-ui-v4/app/build/outputs/apk/debug/app-debug.apk output/80s-YouTube-Audio-UI-v4.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 80s-YouTube-Audio-UI-v4
          path: output/80s-YouTube-Audio-UI-v4.apk
          if-no-files-found: error
          retention-days: 30
