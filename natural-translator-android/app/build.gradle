plugins {
    id "com.android.application"
}

android {
    namespace "gr.kostas.naturaltranslator"
    compileSdk 35

    defaultConfig {
        applicationId "gr.kostas.naturaltranslator"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
}
