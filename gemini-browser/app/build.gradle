plugins { id 'com.android.application' }

android {
    namespace 'com.kostas.geminibrowser'
    compileSdk 35

    defaultConfig {
        applicationId "com.kostas.geminibrowser.finalv2"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
