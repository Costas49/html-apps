plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kostas.lencoremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kostas.lencoremote'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
