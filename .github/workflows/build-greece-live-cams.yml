name: Build Greece Live Cams APK

on:
  push:
    branches: [greece-live-cams-android10]
    paths:
      - 'GreeceLiveCams/**'
      - '.github/workflows/build-greece-live-cams.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p GreeceLiveCams assembleDebug --no-daemon
      - name: Rename APK
        run: cp GreeceLiveCams/app/build/outputs/apk/debug/app-debug.apk GreeceLiveCams/Greece-Live-Cams-Android10.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Greece-Live-Cams-Android10
          path: GreeceLiveCams/Greece-Live-Cams-Android10.apk
          if-no-files-found: error
