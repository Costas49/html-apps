name: Build Kostas Weather TV 12 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "weather-tv-android/**"
      - ".github/workflows/build-weather-tv-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-tv-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Kostas-Weather-TV12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kostas-Weather-TV12-APK
          path: weather-tv-android/app/build/outputs/apk/debug/Kostas-Weather-TV12.apk
          if-no-files-found: error
