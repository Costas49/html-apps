<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kostas Pac-Man TV</title><style>html,body{margin:0;background:#05070d;color:#fff;font-family:system-ui,sans-serif;height:100%;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.wrap{width:min(96vw,1180px);display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:center}.panel{background:#0d1320;border:2px solid #263957;border-radius:18px;padding:18px}.title{font-size:30px;font-weight:800;margin-bottom:12px}.stat{font-size:22px;margin:12px 0}.hint{color:#a9bdd3;font-size:18px;line-height:1.45}.btn{width:100%;margin-top:14px;padding:14px;border-radius:12px;border:2px solid #3c5c88;background:#15243b;color:white;font-size:20px}.btn:focus{outline:4px solid white}canvas{width:100%;height:auto;aspect-ratio:19/21;background:#000;border:4px solid #1f48ff;border-radius:12px;image-rendering:pixelated}@media(max-width:900px){.wrap{grid-template-columns:1fr}.panel{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.title{width:100%}.btn{width:auto;min-width:180px}}</style></head><body><div class="wrap"><canvas id="game" width="570" height="630"></canvas><div class="panel"><div class="title">🟡 Kostas Pac‑Man TV</div><div class="stat">Σκορ: <b id="score">0</b></div><div class="stat">Ζωές: <b id="lives">3</b></div><div class="stat">Επίπεδο: <b id="level">1</b></div><button class="btn" id="restart">Νέο παιχνίδι</button><div class="hint">Χειριστήριο: βελάκια / D‑pad για κίνηση. OK/Enter ξεκινά ή ξαναρχίζει. Φάε όλες τις τελείες και απόφυγε τα φαντάσματα.</div></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),S=30,ROWS=21,COLS=19;
const raw=['###################','#........#........#','#.###.###.#.###.###.#'.slice(0,19),'#o###.###.#.###.###o#'.slice(0,19),'#.................#','#.###.#.#####.#.###.#'.slice(0,19),'#.....#...#...#.....#'.slice(0,19),'#####.### # ###.#####'.slice(0,19),'    #.#       #.#    '.slice(0,19),'#####.# ## ## #.#####'.slice(0,19),'     .  #GGG#  .     '.slice(0,19),'#####.# ##### #.#####'.slice(0,19),'    #.#       #.#    '.slice(0,19),'#####.# ##### #.#####'.slice(0,19),'#........#........#','#.###.###.#.###.###.#'.slice(0,19),'#o..#.....P.....#..o#'.slice(0,19),'###.#.#.#####.#.#.###'.slice(0,19),'#.....#...#...#.....#'.slice(0,19),'#.#######.#.#######.#'.slice(0,19),'###################'];
let map,player,ghosts,dir={r:0,c:0},nextDir={r:0,c:0},score=0,lives=3,level=1,started=false,last=0,acc=0,power=0;
function resetMap(){map=raw.map(r=>r.padEnd(COLS,' ').slice(0,COLS).split(''));ghosts=[];player=null;for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){let v=map[r][col];if(v==='P'){player={r:r,c:col};map[r][col]=' ';}if(v==='G'){ghosts.push({r:r,c:col,dr:0,dc:1});map[r][col]=' ';}}if(!ghosts.length)ghosts=[{r:10,c:8,dr:0,dc:1},{r:10,c:9,dr:0,dc:-1},{r:10,c:10,dr:1,dc:0}];if(!player)player={r:16,c:9};}
function wall(r,col){if(r<0||r>=ROWS)return true;if(col<0||col>=COLS)return false;return map[r][col]==='#';}function wrap(o){if(o.c<0)o.c=COLS-1;if(o.c>=COLS)o.c=0;}function can(o,d){return !wall(o.r+d.r,o.c+d.c)}
function stepPlayer(){if(can(player,nextDir))dir={...nextDir};if(can(player,dir)){player.r+=dir.r;player.c+=dir.c;wrap(player);}let t=map[player.r][player.c];if(t==='.'||t==='o'){score+=t==='o'?50:10;if(t==='o')power=70;map[player.r][player.c]=' ';document.getElementById('score').textContent=score;}if(!map.some(row=>row.includes('.')||row.includes('o'))){level++;document.getElementById('level').textContent=level;resetMap();dir={r:0,c:0};nextDir={r:0,c:0};}}
function choices(g){return [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1}].filter(d=>can(g,d)&&!(d.r===-g.dr&&d.c===-g.dc));}
function stepGhost(g){let opts=choices(g);if(!opts.length)opts=[{r:-g.dr,c:-g.dc}];let target=power>0?{r:Math.floor(Math.random()*ROWS),c:Math.floor(Math.random()*COLS)}:player;opts.sort((a,b)=>{const da=Math.abs(g.r+a.r-target.r)+Math.abs(g.c+a.c-target.c),db=Math.abs(g.r+b.r-target.r)+Math.abs(g.c+b.c-target.c);return power>0?db-da:da-db});let pick=Math.random()<0.28?opts[Math.floor(Math.random()*opts.length)]:opts[0];g.dr=pick.r;g.dc=pick.c;g.r+=g.dr;g.c+=g.dc;wrap(g);}
function resetPositions(){player.r=16;player.c=9;dir={r:0,c:0};nextDir={r:0,c:0};const ps=[[10,8],[10,9],[10,10]];ghosts.forEach((g,i)=>{g.r=ps[i%3][0];g.c=ps[i%3][1];g.dr=0;g.dc=i%2?1:-1;});}
function collision(){for(let g of ghosts){if(g.r===player.r&&g.c===player.c){if(power>0){score+=200;document.getElementById('score').textContent=score;g.r=10;g.c=9;g.dr=0;g.dc=1;}else{lives--;document.getElementById('lives').textContent=lives;if(lives<=0){started=false;setTimeout(()=>alert('Τέλος παιχνιδιού — Σκορ: '+score),50);}else resetPositions();}break;}}}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){let v=map[r][col],px=col*S,py=r*S;if(v==='#'){x.fillStyle='#1028ba';x.fillRect(px+2,py+2,S-4,S-4);x.strokeStyle='#3d6cff';x.lineWidth=2;x.strokeRect(px+4,py+4,S-8,S-8);}else if(v==='.'||v==='o'){x.fillStyle=v==='o'?'#fff6a8':'#ffd9a1';x.beginPath();x.arc(px+S/2,py+S/2,v==='o'?6:2.8,0,Math.PI*2);x.fill();}}
const px=player.c*S+S/2,py=player.r*S+S/2;x.fillStyle='#ffe21c';x.beginPath();let ang=Math.atan2(dir.r,dir.c);if(!dir.r&&!dir.c)ang=0;let mouth=.28+Math.abs(Math.sin(Date.now()/90))*.25;x.moveTo(px,py);x.arc(px,py,12,ang+mouth,ang+Math.PI*2-mouth);x.closePath();x.fill();const cols=power>0?['#4da6ff','#4da6ff','#4da6ff']:['#ff4b4b','#ff8bd1','#5fe4ff'];ghosts.forEach((g,i)=>{let gx=g.c*S+S/2,gy=g.r*S+S/2;x.fillStyle=cols[i%3];x.beginPath();x.arc(gx,gy-3,11,Math.PI,0);x.lineTo(gx+11,gy+10);x.lineTo(gx+4,gy+6);x.lineTo(gx,gy+10);x.lineTo(gx-4,gy+6);x.lineTo(gx-11,gy+10);x.closePath();x.fill();x.fillStyle='#fff';x.beginPath();x.arc(gx-4,gy-4,3,0,7);x.arc(gx+4,gy-4,3,0,7);x.fill();});if(!started){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.textAlign='center';x.font='bold 34px system-ui';x.fillText('Πάτησε OK / ENTER',c.width/2,c.height/2);x.font='22px system-ui';x.fillText('για να ξεκινήσεις',c.width/2,c.height/2+42);}}
function loop(t){if(!last)last=t;let dt=t-last;last=t;if(started){acc+=dt;let speed=Math.max(105-level*5,70);while(acc>speed){stepPlayer();ghosts.forEach(stepGhost);collision();if(power>0)power--;acc-=speed;}}draw();requestAnimationFrame(loop)}function setDir(k){const m={ArrowUp:{r:-1,c:0},ArrowDown:{r:1,c:0},ArrowLeft:{r:0,c:-1},ArrowRight:{r:0,c:1}};if(m[k]){nextDir=m[k];started=true;return true}return false}addEventListener('keydown',e=>{if(setDir(e.key)){e.preventDefault();}else if(e.key==='Enter'||e.key===' '){started=true;e.preventDefault();}});document.getElementById('restart').onclick=()=>{score=0;lives=3;level=1;power=0;document.getElementById('score').textContent=0;document.getElementById('lives').textContent=3;document.getElementById('level').textContent=1;resetMap();started=true;};resetMap();requestAnimationFrame(loop);
</script></body></html>
