name: Build Source Mind TV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "source-mind-tv/**"
      - ".github/workflows/build-source-mind-tv.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-mind-tv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Source-Mind-TV-Android12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Source-Mind-TV-Android12
          path: source-mind-tv/app/build/outputs/apk/debug/Source-Mind-TV-Android12.apk
          if-no-files-found: error
