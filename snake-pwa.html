<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <title>Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #header {
            padding: 8px;
            text-align: center;
            background: #1a1a1a;
            border-bottom: 2px solid #00ff00;
            font-size: 14px;
        }

        #gameContainer {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }

        canvas {
            border: 3px solid #00ff00;
            background: #0a0a0a;
            image-rendering: pixelated;
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 4/3;
        }

        #infoBar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 4px;
            font-size: 13px;
        }

        #infoBar span {
            font-weight: bold;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 8px;
            margin-bottom: 10px;
        }

        button {
            width: 50px;
            height: 50px;
            background: #002200;
            color: #00ff00;
            border: 2px solid #00ff00;
            font-size: 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }

        button:active {
            background: #004400;
        }

        #spacer {
            grid-column: 1 / -1;
        }

        #helpText {
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 5px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="header">
    🐍 SNAKE GAME — Lenovo TB-8505F
</div>

<div id="gameContainer">
    <canvas id="canvas" width="400" height="300"></canvas>

    <div id="infoBar">
        <div>Σκορ: <span id="score">0</span></div>
        <div>Best: <span id="best">0</span></div>
    </div>

    <div id="controls">
        <div></div>
        <button id="upBtn" data-dir="up">▲</button>
        <div></div>
        <button id="leftBtn" data-dir="left">◀</button>
        <button id="downBtn" data-dir="down">▼</button>
        <button id="rightBtn" data-dir="right">▶</button>
    </div>

    <div id="helpText">
        ⌨️ ARROWS | SPACE = Restart | ESC = Home
    </div>
</div>

<script>
// === REGISTER SERVICE WORKER ===
if ('serviceWorker' in navigator) {
    var swCode = `
var CACHE_NAME = 'snake-v1';
var urlsToCache = ['./'];

self.addEventListener('install', function(event) {
    event.waitUntil(
        caches.open(CACHE_NAME).then(function(cache) {
            return cache.add('./');
        })
    );
});

self.addEventListener('activate', function(event) {
    event.waitUntil(Promise.resolve());
});

self.addEventListener('fetch', function(event) {
    event.respondWith(
        caches.match(event.request).then(function(response) {
            if (response) return response;
            return fetch(event.request).catch(function() {
                return new Response('Offline', {status: 503});
            });
        })
    );
});
`;
    
    var blob = new Blob([swCode], {type: 'application/javascript'});
    var swUrl = URL.createObjectURL(blob);
    
    navigator.serviceWorker.register(swUrl, {scope: './'}).catch(function(err) {
        console.log('SW registration failed:', err);
    });
}

// === GAME ENGINE ===
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');

var GRID = 10;
var COLS = Math.floor(canvas.width / GRID);
var ROWS = Math.floor(canvas.height / GRID);
var FPS = 10;

var snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
var food = {};
var score = 0;
var best = parseInt(localStorage.getItem('snakeBest') || '0');
var direction = {x: 1, y: 0};
var nextDir = {x: 1, y: 0};
var gameOver = false;
var gameRunning = true;

document.getElementById('best').textContent = best;

function spawnFood() {
    var x, y, collision;
    do {
        x = Math.floor(Math.random() * COLS);
        y = Math.floor(Math.random() * ROWS);
        collision = false;
        for (var i = 0; i < snake.length; i++) {
            if (snake[i].x === x && snake[i].y === y) {
                collision = true;
                break;
            }
        }
    } while (collision);
    food = {x: x, y: y};
}

function resetGame() {
    snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
    direction = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    gameOver = false;
    spawnFood();
    document.getElementById('score').textContent = score;
}

function changeDir(dx, dy) {
    if (direction.x === -dx && direction.y === -dy) return;
    nextDir = {x: dx, y: dy};
}

function update() {
    if (gameOver) return;

    direction = nextDir;
    var head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

    // Collision: walls
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver = true;
        if (score > best) {
            best = score;
            localStorage.setItem('snakeBest', best);
            document.getElementById('best').textContent = best;
        }
        return;
    }

    // Collision: self
    for (var i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            gameOver = true;
            if (score > best) {
                best = score;
                localStorage.setItem('snakeBest', best);
                document.getElementById('best').textContent = best;
            }
            return;
        }
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        spawnFood();
    } else {
        snake.pop();
    }
}

function draw() {
    // Background
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 0.5;
    for (var x = 0; x <= canvas.width; x += GRID) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (var y = 0; y <= canvas.height; y += GRID) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    // Snake
    for (var i = 0; i < snake.length; i++) {
        var s = snake[i];
        if (i === 0) {
            ctx.fillStyle = '#00ff00';
        } else {
            ctx.fillStyle = '#00aa00';
        }
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
    }

    // Food
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4);

    // Game Over overlay
    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#00ff00';
        ctx.font = '16px Courier New';
        ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Press SPACE', canvas.width / 2, canvas.height / 2 + 35);
    }
}

function gameLoop() {
    update();
    draw();
}

// === INPUT ===
document.addEventListener('keydown', function(e) {
    var key = e.key.toLowerCase();
    if (key === 'arrowup' || key === 'w') changeDir(0, -1);
    else if (key === 'arrowdown' || key === 's') changeDir(0, 1);
    else if (key === 'arrowleft' || key === 'a') changeDir(-1, 0);
    else if (key === 'arrowright' || key === 'd') changeDir(1, 0);
    else if (key === ' ') resetGame();
    e.preventDefault();
}, false);

// Touch buttons
document.getElementById('upBtn').addEventListener('click', function() {
    changeDir(0, -1);
});
document.getElementById('downBtn').addEventListener('click', function() {
    changeDir(0, 1);
});
document.getElementById('leftBtn').addEventListener('click', function() {
    changeDir(-1, 0);
});
document.getElementById('rightBtn').addEventListener('click', function() {
    changeDir(1, 0);
});

// Prevent zoom on double-tap
document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) e.preventDefault();
}, {passive: false});

// Prevent context menu
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
}, false);

// === INIT ===
resetGame();
setInterval(gameLoop, 1000 / FPS);
draw();

// Keep screen awake (fullscreen-like)
document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement) {
        console.log('Exited fullscreen');
    }
});

console.log('Snake PWA loaded - Android 10 optimized');
</script>

</body>
</html>
