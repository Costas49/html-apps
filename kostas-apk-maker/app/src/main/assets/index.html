<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kostas APK Maker</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:880px;margin:auto;padding:22px}
h1{margin:0 0 6px;font-size:30px}
.sub{color:#aab5d6;margin:0 0 20px;line-height:1.45}
.card{background:#131a2d;border:1px solid #27304a;border-radius:18px;padding:18px;margin:14px 0}
label{display:block;font-weight:700;margin:13px 0 7px}
input,textarea,button{font:inherit}
input,textarea{width:100%;border:1px solid #394362;background:#0d1427;color:white;border-radius:12px;padding:12px}
textarea{min-height:250px;resize:vertical;font-family:monospace;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.55}
.primary{background:#6d5dfc;color:white;flex:1}
.secondary{background:#25304e;color:white}
.danger{background:#48232b;color:#ffd8dd}
#status{white-space:pre-wrap;line-height:1.45;background:#090e1a;border-radius:12px;padding:13px;min-height:70px;color:#c9d5ff}
.good{color:#85f0b0}.bad{color:#ff969e}
.small{font-size:12px;color:#9ca8ca;line-height:1.45}
.note{border-left:4px solid #6d5dfc;padding-left:10px}
#download{display:none;background:#16a36a;color:white;width:100%;margin-top:12px}
#actions{background:#25304e;color:white;width:100%;margin-top:10px}
@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:14px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚙️ Kostas APK Maker 2</h1>
  <p class="sub">HTML → APK με ένα πάτημα. Το GitHub workflow είναι ήδη έτοιμο και ξεκινά αυτόματα.</p>

  <div class="card">
    <label>GitHub token</label>
    <input id="token" type="password" placeholder="github_pat_... ή ghp_..." autocomplete="off">
    <div class="actions">
      <button class="secondary" id="saveToken">Αποθήκευση token</button>
      <button class="danger" id="clearToken">Διαγραφή token</button>
    </div>
    <p class="small note">Στη νέα έκδοση το token χρειάζεται μόνο πρόσβαση στο repository και <b>Contents: Read and write</b>. Δεν χρειάζεται Actions: write ούτε δημιουργία workflow από την εφαρμογή.</p>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Όνομα εφαρμογής</label>
        <input id="appName" value="Η Εφαρμογή μου">
      </div>
      <div>
        <label>Package name</label>
        <input id="packageName" value="com.costas.myapp">
      </div>
    </div>

    <label>Φόρτωσε αρχείο HTML</label>
    <input id="htmlFile" type="file" accept=".html,.htm,text/html">

    <label>ή επικόλλησε HTML</label>
    <textarea id="htmlCode" spellcheck="false"><!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Η εφαρμογή μου</title>
</head>
<body>
<h1>Γεια σου!</h1>
<p>Αυτό θα γίνει APK.</p>
</body>
</html></textarea>

    <button class="primary" id="build">ΦΤΙΑΞΕ APK</button>
  </div>

  <div class="card">
    <strong>Κατάσταση</strong>
    <div id="status">Έτοιμο.</div>
    <button id="download">⬇ ΚΑΤΕΒΑΣΕ ΤΟ APK</button>
    <button id="actions">Άνοιγμα GitHub Actions</button>
  </div>
</div>

<script>
const OWNER='Costas49';
const REPO='html-apps';
const BRANCH='main';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO;
const WORKFLOW='build-generated-app.yml';
const REQUEST_PATH='generated-app/build-request.json';
const DOWNLOAD='https://github.com/'+OWNER+'/'+REPO+'/releases/download/generated-apk-latest/Generated-App.apk';
const ACTIONS_URL='https://github.com/'+OWNER+'/'+REPO+'/actions/workflows/'+WORKFLOW;

const $=id=>document.getElementById(id);
const status=(msg,kind='')=>{
  $('status').textContent=msg;
  $('status').className=kind;
};

function nativeLoadToken(){
  try{return AndroidVault.loadToken()||''}catch(e){return localStorage.getItem('github_token')||''}
}
function nativeSaveToken(v){
  try{AndroidVault.saveToken(v)}catch(e){localStorage.setItem('github_token',v)}
}
function nativeClearToken(){
  try{AndroidVault.clearToken()}catch(e){localStorage.removeItem('github_token')}
}
function openExternal(url){
  try{AndroidVault.openExternal(url)}catch(e){location.href=url}
}

$('token').value=nativeLoadToken();

$('saveToken').onclick=()=>{
  const t=$('token').value.trim();
  nativeSaveToken(t);
  status(t?'Token αποθηκεύτηκε στη συσκευή.':'Δεν υπάρχει token.',t?'good':'bad');
};
$('clearToken').onclick=()=>{
  nativeClearToken();
  $('token').value='';
  status('Το αποθηκευμένο token διαγράφηκε.');
};

$('htmlFile').addEventListener('change',async e=>{
  const f=e.target.files && e.target.files[0];
  if(!f)return;
  $('htmlCode').value=await f.text();
  status('Φορτώθηκε: '+f.name,'good');
});

function authHeaders(token){
  return {
    'Accept':'application/vnd.github+json',
    'Authorization':'Bearer '+token,
    'X-GitHub-Api-Version':'2022-11-28'
  };
}

async function apiAuth(token,path,options={}){
  const h={...authHeaders(token),...(options.headers||{})};
  const r=await fetch(API+path,{...options,headers:h});
  if(r.status===204)return null;
  const text=await r.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch(e){data={message:text}}
  if(!r.ok)throw new Error((data&&data.message)||('GitHub HTTP '+r.status));
  return data;
}

async function apiPublic(path){
  const r=await fetch(API+path,{
    headers:{
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    }
  });
  const text=await r.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch(e){data={message:text}}
  if(!r.ok)throw new Error((data&&data.message)||('GitHub HTTP '+r.status));
  return data;
}

function b64utf8(str){
  const bytes=new TextEncoder().encode(str);
  let binary='';
  const step=0x8000;
  for(let i=0;i<bytes.length;i+=step){
    binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length)));
  }
  return btoa(binary);
}

async function upsertRequest(token,content){
  let sha=null;
  try{
    const old=await apiAuth(token,'/contents/'+REQUEST_PATH+'?ref='+encodeURIComponent(BRANCH));
    sha=old.sha;
  }catch(e){
    if(!String(e.message).includes('Not Found'))throw e;
  }

  const body={
    message:'APK Maker 2: new build request',
    content:b64utf8(content),
    branch:BRANCH
  };
  if(sha)body.sha=sha;

  return apiAuth(token,'/contents/'+REQUEST_PATH,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
}

function validPackage(p){
  return /^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*){1,}$/.test(p);
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function waitForRun(commitSha){
  for(let i=0;i<36;i++){
    const d=await apiPublic('/actions/workflows/'+WORKFLOW+'/runs?event=push&branch='+BRANCH+'&per_page=10');
    const runs=(d.workflow_runs||[]).filter(r=>r.head_sha===commitSha);
    if(runs.length)return runs[0];
    status('✅ Το αίτημα στάλθηκε.\nΠεριμένω να ξεκινήσει το GitHub build…');
    await sleep(10000);
  }
  throw new Error('Το build στάλθηκε, αλλά δεν μπόρεσα να δω την εκκίνησή του. Άνοιξε GitHub Actions.');
}

async function waitForCompletion(run){
  for(let i=0;i<45;i++){
    const r=await apiPublic('/actions/runs/'+run.id);
    status('Χτίζω το APK…\nΚατάσταση: '+r.status+(r.status==='completed'?' / '+r.conclusion:'')+'\nΜην κλείσεις την εφαρμογή.');
    if(r.status==='completed'){
      if(r.conclusion==='success')return r;
      throw new Error('Το GitHub build τελείωσε με αποτέλεσμα: '+r.conclusion);
    }
    await sleep(10000);
  }
  throw new Error('Το build αργεί. Άνοιξε GitHub Actions για να δεις την πορεία.');
}

$('download').onclick=()=>openExternal(DOWNLOAD+'?v='+Date.now());
$('actions').onclick=()=>openExternal(ACTIONS_URL);

$('build').onclick=async()=>{
  $('download').style.display='none';

  const token=$('token').value.trim()||nativeLoadToken();
  const appName=$('appName').value.trim();
  const packageName=$('packageName').value.trim();
  const html=$('htmlCode').value;

  if(!token){status('Χρειάζεται το GitHub token που έχεις ήδη.','bad');return}
  if(!appName){status('Βάλε όνομα εφαρμογής.','bad');return}
  if(!validPackage(packageName)){status('Το package name δεν είναι σωστό. Παράδειγμα: com.costas.myapp','bad');return}
  if(!html.trim()){status('Δεν υπάρχει HTML.','bad');return}

  nativeSaveToken(token);
  $('build').disabled=true;

  try{
    const now=Math.floor(Date.now()/1000);
    const versionName=new Date().toISOString().slice(0,10).replace(/-/g,'.');
    const request={
      request_id:String(Date.now()),
      app_name:appName,
      package_name:packageName,
      version_code:now,
      version_name:versionName,
      html_b64:b64utf8(html)
    };

    status('1/3 Στέλνω το HTML στο GitHub…');
    const saved=await upsertRequest(token,JSON.stringify(request,null,2));
    const commitSha=saved&&saved.commit&&saved.commit.sha;
    if(!commitSha)throw new Error('Δεν επέστρεψε commit SHA από το GitHub.');

    status('2/3 Το GitHub πήρε το αίτημα. Περιμένω το build…');
    const run=await waitForRun(commitSha);

    status('3/3 Το APK χτίζεται…');
    await waitForCompletion(run);

    status('✅ Το APK είναι έτοιμο.\nΠάτησε «ΚΑΤΕΒΑΣΕ ΤΟ APK».','good');
    $('download').style.display='block';
  }catch(e){
    const msg=String(e&&e.message?e.message:e);
    if(msg.includes('Resource not accessible by personal access token')){
      status('❌ Το token δεν έχει δικαίωμα Contents: Read and write στο repository html-apps.\nΔεν χρειάζεται Actions: write στη νέα έκδοση.','bad');
    }else{
      status('❌ '+msg,'bad');
    }
  }finally{
    $('build').disabled=false;
  }
};
</script>
</body>
</html>
