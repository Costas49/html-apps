plugins {
    id 'com.android.application'
}

android {
    namespace 'com.costas.eightiesplayerclean'
    compileSdk 34

    defaultConfig {
        applicationId "com.costas.eightiesplayerclean"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
