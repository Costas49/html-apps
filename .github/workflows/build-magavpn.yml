name: Build MagaVPN APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "MagaVPN/**"
      - ".github/workflows/build-magavpn.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build APK
        run: gradle -p MagaVPN :app:assembleDebug --stacktrace

      - name: Prepare download
        run: |
          cp MagaVPN/app/build/outputs/apk/debug/app-debug.apk MagaVPN.apk
          sha256sum MagaVPN.apk > MagaVPN.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MagaVPN-APK
          path: |
            MagaVPN.apk
            MagaVPN.apk.sha256
          retention-days: 30
