plugins {
    id "com.android.application"
}

android {
    namespace "com.kostas.sourcemindtv"
    compileSdk 35

    defaultConfig {
        applicationId "com.kostas.sourcemindtv"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"
}
