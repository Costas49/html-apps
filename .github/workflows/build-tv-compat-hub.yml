name: Build TV Compatibility Hub APK

on:
  push:
    branches:
      - tv-compat-hub
    paths:
      - 'TVCompatHub/**'
      - '.github/workflows/build-tv-compat-hub.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: TVCompatHub
        run: gradle :app:assembleDebug --stacktrace --non-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVCompatibilityHub-AndroidTV12-debug
          path: TVCompatHub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
