name: Build Thunderbolt Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "thunderbolt-browser/**"
      - ".github/workflows/build-thunderbolt-browser.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: thunderbolt-browser
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp thunderbolt-browser/app/build/outputs/apk/debug/app-debug.apk Thunderbolt-Browser-2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Thunderbolt-Browser-APK
          path: Thunderbolt-Browser-2.0.apk
