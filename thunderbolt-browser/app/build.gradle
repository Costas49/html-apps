plugins {
    id 'com.android.application'
}

android {
    namespace 'com.costas.shieldbrowser'
    compileSdk 36

    defaultConfig {
        applicationId 'com.costas.thunderboltbrowser'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
